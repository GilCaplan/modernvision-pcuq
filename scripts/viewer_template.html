<title>Uncertainty Mode Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #14171c; --panel: #1c2129; --panel-2: #232a35;
    --ink: #e8eaf0; --muted: #8a93a6; --line: #2e3644;
    --coral: #ff8a7a; --coral-dim: #a05a52; --blue: #3987e5;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink);
         font-family: var(--sans); font-size: 14px; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px 10px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .main { display: flex; flex: 1; min-height: 0; }
  aside { width: 272px; flex: none; overflow-y: auto; padding: 16px;
          border-right: 1px solid var(--line); display: flex;
          flex-direction: column; gap: 18px; background: var(--panel); }
  .viewport { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%;
           touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .hint { position: absolute; right: 14px; bottom: 10px; color: var(--muted);
          font-size: 11.5px; pointer-events: none; }
  .group-label { font-size: 10.5px; text-transform: uppercase;
                 letter-spacing: .09em; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--ink); background: var(--panel-2);
           border: 1px solid var(--line); border-radius: 6px;
           padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue);
                                color: #fff; }
  .mode-btn { display: flex; justify-content: space-between; width: 100%;
              gap: 10px; }
  .mode-btn .lam { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .mode-btn[aria-pressed="true"] .lam { color: #eaf2ff; }
  .modes { display: flex; flex-direction: column; gap: 6px; }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { flex: 1; accent-color: var(--coral); }
  input[type="range"]:focus-visible { outline: 2px solid var(--blue); }
  .t-readout { font-family: var(--mono); font-size: 12.5px; width: 74px;
               text-align: right; font-variant-numeric: tabular-nums; }
  .toggles { display: flex; flex-direction: column; gap: 8px; }
  .toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer;
                   color: var(--ink); }
  .toggles input { accent-color: var(--blue); }
  .readout { font-family: var(--mono); font-size: 12px; color: var(--muted);
             line-height: 1.75; border-top: 1px solid var(--line); padding-top: 12px; }
  .readout b { color: var(--ink); font-weight: 500; }
  @media (max-width: 760px) {
    .main { flex-direction: column; }
    aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--line);
            max-height: 45vh; }
  }
</style>
<div class="app">
  <header>
    <h1>Uncertainty Mode Explorer</h1>
    <p>Posterior uncertainty of a frozen point-cloud denoiser — pick a shape and
       region, choose a mode, and sweep x&#770; + t·&radic;&lambda;·v.</p>
  </header>
  <div class="main">
    <aside>
      <div><p class="group-label">Shape</p><div class="chips" id="shapes"></div></div>
      <div><p class="group-label">Noise level &sigma;</p><div class="chips" id="sigmas"></div></div>
      <div><p class="group-label">Mode &middot; eigenvalue &lambda;</p><div class="modes" id="modes"></div></div>
      <div>
        <p class="group-label">Sweep t (units of &radic;&lambda;)</p>
        <div class="slider-row">
          <input type="range" id="t" min="-3" max="3" step="0.05" value="0"
                 aria-label="sweep amount t">
          <span class="t-readout" id="tval">t = 0.00</span>
        </div>
        <div class="slider-row" style="margin-top:8px">
          <button id="osc" aria-pressed="false">Oscillate</button>
          <button id="reset">Reset t</button>
        </div>
      </div>
      <div class="toggles">
        <p class="group-label" style="margin-bottom:0">Display</p>
        <label><input type="checkbox" id="dimctx" checked> Dim points outside the region</label>
        <label><input type="checkbox" id="ghost" checked> Ghost of the t&thinsp;=&thinsp;0 position</label>
        <label><input type="checkbox" id="spin"> Auto-rotate</label>
      </div>
      <div class="readout" id="readout"></div>
    </aside>
    <div class="viewport">
      <canvas id="c"></canvas>
      <div class="hint">drag to rotate &middot; scroll to zoom</div>
    </div>
  </div>
</div>
<script>const DATA=/*__DATA__*/;</script>
<script>
(() => {
  const runs = DATA.runs;
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const state = { shape: runs[0].shape, sigma: null, mode: 0, t: 0,
                  yaw: 0.7, pitch: -0.35, zoom: 1, osc: false, spin: !reduced,
                  dimctx: true, ghost: true };
  $("spin").checked = state.spin;

  const shapes = [...new Set(runs.map(r => r.shape))];
  const sigmasFor = s => [...new Set(runs.filter(r => r.shape === s)
                          .map(r => r.sigma))].sort((a, b) => a - b);
  const run = () => runs.find(r => r.shape === state.shape && r.sigma === state.sigma);

  let P = null; // prepared geometry for the current run
  function prepare() {
    const r = run(), n = r.mask.length;
    const maskIdx = []; r.mask.forEach((m, i) => { if (m) maskIdx.push(i); });
    P = { r, n, maskIdx,
          base: r.x_hat,                       // flat [x,y,z]*n
          mode: r.modes[state.mode],           // flat, masked points only
          mags: null, magMax: 1e-30 };
    P.mags = maskIdx.map((_, j) => Math.hypot(P.mode[3 * j], P.mode[3 * j + 1],
                                              P.mode[3 * j + 2]));
    P.magMax = Math.max(...P.mags, 1e-30);
  }

  function chips(el, items, fmt, get, set) {
    el.replaceChildren(...items.map(v => {
      const b = document.createElement("button");
      b.textContent = fmt(v);
      b.setAttribute("aria-pressed", String(get() === v));
      b.onclick = () => { set(v); render(); };
      return b;
    }));
  }
  function buildControls() {
    if (!sigmasFor(state.shape).includes(state.sigma))
      state.sigma = sigmasFor(state.shape)[0];
    chips($("shapes"), shapes, v => v.replace(/_/g, " "),
          () => state.shape, v => { state.shape = v; buildControls(); });
    chips($("sigmas"), sigmasFor(state.shape), v => "σ = " + v,
          () => state.sigma, v => { state.sigma = v; buildControls(); });
    const r = run();
    if (state.mode >= r.eigvals.length) state.mode = 0;
    $("modes").replaceChildren(...r.eigvals.map((lam, i) => {
      const b = document.createElement("button");
      b.className = "mode-btn";
      b.setAttribute("aria-pressed", String(state.mode === i));
      b.innerHTML = `<span>mode ${i}</span><span class="lam">λ = ${lam.toExponential(2)}</span>`;
      b.onclick = () => { state.mode = i; buildControls(); render(); };
      return b;
    }));
    const spread = Math.round(r.spread * 100);
    $("readout").innerHTML =
      `run <b>${r.tag}</b><br>` +
      `region <b>r${r.region}</b> · <b>${r.mask.reduce((a, b) => a + b, 0)}</b> of ${r.mask.length} points<br>` +
      `eigenvalue spread <b>${spread}%</b><br>` +
      `σ² bound <b>${(r.sigma * r.sigma).toExponential(2)}</b><br><br>` +
      `Measured data: ModelNet40 test shape,<br>denoised by frozen Noise2Score3D;<br>` +
      `modes from subspace iteration on its<br>Jacobian (outputs/masked/masked_modes).`;
    prepare();
  }

  function project(x, y, z, cy, sy, cp, sp) {
    const x1 = cy * x + sy * z, z1 = -sy * x + cy * z;
    return [x1, cp * y - sp * z1, sp * y + cp * z1];
  }
  const lerp = (a, b, u) => a + (b - a) * u;
  function coral(u, depth) { // magnitude u in [0,1], depth shade in [0,1]
    const r = lerp(160, 255, u), g = lerp(90, 138, u), b = lerp(82, 122, u);
    const d = lerp(0.55, 1, depth);
    return `rgb(${r * d | 0},${g * d | 0},${b * d | 0})`;
  }
  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight, dpr = devicePixelRatio || 1;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#14171c"; ctx.fillRect(0, 0, w, h);
    if (!P) return;
    const s = 0.42 * Math.min(w, h) * state.zoom, cx = w / 2, cyy = h / 2;
    const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const step = state.t * Math.sqrt(Math.max(P.r.eigvals[state.mode], 0));
    const pts = [];
    const inRegion = new Array(P.n).fill(-1);
    P.maskIdx.forEach((i, j) => inRegion[i] = j);
    for (let i = 0; i < P.n; i++) {
      let x = P.base[3 * i], y = P.base[3 * i + 1], z = P.base[3 * i + 2];
      const j = inRegion[i];
      if (j >= 0 && state.ghost && Math.abs(state.t) > 0.05) {
        const [gx, gy, gz] = project(x, y, z, cy, sy, cp, sp);
        pts.push({ x: cx + s * gx, y: cyy - s * gy, z: gz, kind: 2, u: 0 });
      }
      if (j >= 0) {
        x += step * P.mode[3 * j]; y += step * P.mode[3 * j + 1];
        z += step * P.mode[3 * j + 2];
      }
      const [px, py, pz] = project(x, y, z, cy, sy, cp, sp);
      pts.push({ x: cx + s * px, y: cyy - s * py, z: pz,
                 kind: j >= 0 ? 1 : 0, u: j >= 0 ? P.mags[j] / P.magMax : 0 });
    }
    pts.sort((a, b) => a.z - b.z);
    for (const p of pts) {
      const depth = Math.min(1, Math.max(0, 0.5 + p.z * 0.6));
      if (p.kind === 2) { ctx.fillStyle = "rgba(255,138,122,0.16)"; }
      else if (p.kind === 1) { ctx.fillStyle = coral(p.u, depth); }
      else {
        const d = lerp(0.5, 1, depth), dim = state.dimctx ? 0.45 : 0.9;
        ctx.fillStyle = `rgba(${116 * d | 0},${127 * d | 0},${148 * d | 0},${dim})`;
      }
      const rad = (p.kind === 1 ? 2.3 : 1.7) * lerp(0.75, 1.15, depth);
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 6.2832); ctx.fill();
    }
  }

  function render() { draw(); }
  let last = performance.now();
  function tick(now) {
    const dt = (now - last) / 1000; last = now;
    let moving = false;
    if (state.spin) { state.yaw += dt * 0.35; moving = true; }
    if (state.osc) {
      state.t = 3 * Math.sin(now / 900);
      $("t").value = state.t; $("tval").textContent = "t = " + state.t.toFixed(2);
      moving = true;
    }
    if (moving) draw();
    requestAnimationFrame(tick);
  }

  // controls
  $("t").oninput = e => { state.t = +e.target.value; state.osc = false;
    $("osc").setAttribute("aria-pressed", "false");
    $("tval").textContent = "t = " + state.t.toFixed(2); draw(); };
  $("osc").onclick = () => { state.osc = !state.osc;
    $("osc").setAttribute("aria-pressed", String(state.osc)); };
  $("reset").onclick = () => { state.t = 0; state.osc = false;
    $("osc").setAttribute("aria-pressed", "false");
    $("t").value = 0; $("tval").textContent = "t = 0.00"; draw(); };
  $("dimctx").onchange = e => { state.dimctx = e.target.checked; draw(); };
  $("ghost").onchange = e => { state.ghost = e.target.checked; draw(); };
  $("spin").onchange = e => { state.spin = e.target.checked; };

  let drag = null;
  canvas.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY }; canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    state.yaw += (e.clientX - drag.x) * 0.008;
    state.pitch = Math.max(-1.4, Math.min(1.4, state.pitch + (e.clientY - drag.y) * 0.008));
    drag = { x: e.clientX, y: e.clientY }; draw();
  });
  canvas.addEventListener("pointerup", () => { drag = null; canvas.classList.remove("dragging"); });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    state.zoom = Math.max(0.4, Math.min(3.5, state.zoom * (e.deltaY < 0 ? 1.08 : 0.93)));
    draw();
  }, { passive: false });
  new ResizeObserver(draw).observe(canvas);

  buildControls();
  draw();
  requestAnimationFrame(tick);
})();
</script>
