# Full-scale profile for the GPU VM. Identical schema to local.yaml — only numbers grow.
# Never run this without the same script passing on configs/local.yaml first (WORKFLOW.md).

name: gpu
device: cuda
seed: 0
double_precision: false   # noise2score3d weights are float32; only the analytic
                          # denoiser honors this flag (stability re-checks)
out_dir: outputs

data:
  dataset: modelnet40
  root: data
  n_shapes: 50
  n_points: 2048
  sigmas: [0.01, 0.02, 0.05]
  categories: [chair, airplane, table, lamp, guitar]

denoiser:
  kind: noise2score3d
  repo: external/Noise2Score3D
  checkpoint: data/checkpoints/noise2score3d_step4500.pth
  freeze_graph: true    # differentiate the smooth branch (see LOG.md 2026-08-17)
  graph_freeze_variant: topology  # full | topology -- see local.yaml; override to
    # `full` for parity with pre-2026-09-16 Phase 3/3.5 numbers

jacobian:
  method: central
  c: 1.0e-3
  batch_jvp: 5

spectrum:
  n_ev: 5
  iters: 15
  symmetrize: true
  mask:                 # region-restricted modes (run_masked_modes.py)
    n_regions: 3
    frac: 0.2

diagnostics:
  check_equivariance: true
  step_size_sweep: [1.0e-2, 1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6]
  compare_autograd: true

# Side quest (scripts/run_depth2d.py): see local.yaml for what this is.
depth2d:
  denoiser: ffhq        # heavier natural-image DDPM; needs ffhq.pt (2.2GB, see WORKFLOW.md)
  repo: external/GaussianDenoisingPosterior
  dataset:
    root: data
    n_shapes: 50
    n_points: 2048
    categories: [chair, airplane, table, lamp, guitar]
  render:
    axis: 2
    dilate: 1
  ffhq:
    from_t: 100
  spectrum:
    n_ev: 4
    iters: 25
  jacobian:
    method: autograd
    c: 1.0e-3
