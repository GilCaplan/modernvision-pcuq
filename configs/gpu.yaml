# Full-scale profile for the GPU VM. Identical schema to local.yaml — only numbers grow.
# Never run this without the same script passing on configs/local.yaml first (WORKFLOW.md).

name: gpu
device: cuda
seed: 0
double_precision: false   # noise2score3d weights are float32; only the analytic
                          # denoiser honors this flag (stability re-checks)
out_dir: outputs

data:
  dataset: modelnet40
  root: data
  n_shapes: 50
  n_points: 2048
  sigmas: [0.01, 0.02, 0.05]
  categories: [chair, airplane, table, lamp, guitar]

denoiser:
  kind: noise2score3d
  repo: external/Noise2Score3D
  checkpoint: data/checkpoints/noise2score3d_step4500.pth
  freeze_graph: true    # differentiate the smooth branch (see LOG.md 2026-08-17)

jacobian:
  method: central
  c: 1.0e-3
  batch_jvp: 5

spectrum:
  n_ev: 5
  iters: 15
  symmetrize: true

diagnostics:
  check_equivariance: true
  step_size_sweep: [1.0e-2, 1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6]
  compare_autograd: true
